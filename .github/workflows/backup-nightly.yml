name: Gece yedeği

# Her gece 03:00 (İstanbul) canlı veritabanının şifreli yedeğini Supabase
# dışındaki S3 uyumlu depoya yükler. Ayın 1'inde aylık kopya da bırakır.
# Gerekli ayarlar ve kurulum: docs/runbook-backup-restore.md
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-nightly
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  database:
    name: Veritabanı yedeği
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-backup
    env:
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: Other
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: "true"
      BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Araçlar (psql, age, rclone)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client age rclone

      - name: Döküm al
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: scripts/backup/backup.sh "$RUNNER_TEMP/backup"

      - name: Şifrele (age, açık anahtarla)
        env:
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          echo "ARCHIVE=rd-yonetim-db-$stamp.tar.gz.age" >> "$GITHUB_ENV"
          tar -C "$RUNNER_TEMP/backup" -czf - . | age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/rd-yonetim-db-$stamp.tar.gz.age"
          rm -rf "$RUNNER_TEMP/backup"

      - name: Dış depoya yükle
        run: |
          rclone copyto "$RUNNER_TEMP/$ARCHIVE" "backup:$BUCKET/db/daily/$ARCHIVE"
          if [ "$(date -u +%d)" = "01" ]; then
            rclone copyto "$RUNNER_TEMP/$ARCHIVE" "backup:$BUCKET/db/monthly/$ARCHIVE"
          fi
          rclone lsl "backup:$BUCKET/db/daily/$ARCHIVE"

  storage:
    name: Belge (Storage) yedeği
    if: vars.BACKUP_ENABLED == 'true' && vars.STORAGE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-backup
    env:
      # Kaynak: Supabase Storage'ın S3 uyumlu erişimi (Project Settings > Storage > S3)
      RCLONE_CONFIG_SUPA_TYPE: s3
      RCLONE_CONFIG_SUPA_PROVIDER: Other
      RCLONE_CONFIG_SUPA_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
      RCLONE_CONFIG_SUPA_REGION: ${{ vars.SUPABASE_STORAGE_S3_REGION }}
      RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_SUPA_FORCE_PATH_STYLE: "true"
      # Hedef: aynı dış depo, rclone crypt ile şifreli
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: Other
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: "true"
      BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      CRYPT_PASSWORD: ${{ secrets.BACKUP_STORAGE_CRYPT_PASSWORD }}
      CRYPT_SALT: ${{ secrets.BACKUP_STORAGE_CRYPT_SALT }}
    steps:
      - name: rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Belgeleri şifreli olarak eşitle (silinen/değişen dosyalar arşive taşınır)
        run: |
          export RCLONE_CONFIG_VAULT_TYPE=crypt
          export RCLONE_CONFIG_VAULT_REMOTE="backup:$BUCKET/storage"
          export RCLONE_CONFIG_VAULT_PASSWORD="$(rclone obscure "$CRYPT_PASSWORD")"
          export RCLONE_CONFIG_VAULT_PASSWORD2="$(rclone obscure "$CRYPT_SALT")"
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          rclone sync supa: vault:current --backup-dir "vault:archive/$stamp" --checksum
          rclone size vault:current
